name: Publish

on:
  push:
    tags:
      - "v*"
  # Retry a registry that failed without tagging again.
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    strategy:
      # One registry failing must not cancel the other mid-publish.
      fail-fast: false
      matrix:
        registry: ["vsce", "ovsx"]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish
        env:
          VSCE_PAT: ${{ secrets.VSCODE_PERSONAL_TOKEN }}
          OVSX_PAT: ${{ secrets.ECLIPSE_PERSONAL_TOKEN }}
        # A rerun skips the registry that already has this version.
        run: pnpm run publish:${{ matrix.registry }} --skip-duplicate
