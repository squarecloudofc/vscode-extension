<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" fill="none"><style>.ls{fill:none;stroke:var(--vscode-foreground,#cccccc);stroke-opacity:.45;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.ln{fill:var(--vscode-foreground,#cccccc);opacity:.3}.ac{fill:var(--vscode-textLink-foreground,#3794ff)}.as{fill:none;stroke:var(--vscode-textLink-foreground,#3794ff);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.kf{fill:var(--vscode-editor-background,#1e1e1e)}.kb{fill:none;stroke:var(--vscode-editor-background,#1e1e1e);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.o{transform-box:fill-box;transform-origin:center}@keyframes qa-tw{0%,100%{opacity:.2}50%{opacity:1}}@keyframes qa-bb{0%,100%{transform:translateY(2px)}50%{transform:translateY(-4px)}}@keyframes qa-sd{50%{transform:scaleX(.8)}}@keyframes qa-pl{50%{transform:scale(1.1)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><ellipse class="ln o" cx="120" cy="142" rx="30" ry="3.5" style="animation:qa-sd 3s ease-in-out infinite"/><g style="animation:qa-bb 3s ease-in-out infinite"><path class="ac" d="M80 42A40 11 0 0 1 160 42V104A40 11 0 0 1 80 104Z" opacity=".06"/><ellipse class="ls" cx="120" cy="42" rx="40" ry="11" style="stroke-dasharray:5 5"/><path class="ls" d="M80 42V104A40 11 0 0 0 160 104V42M80 73A40 11 0 0 0 160 73" style="stroke-dasharray:5 5"/><g class="o" style="animation:qa-pl 3s ease-in-out infinite"><circle class="kf" cx="158" cy="104" r="15"/><circle class="ac" cx="158" cy="104" r="13"/><path class="kb" d="M158 98.5v11M152.5 104h11" style="stroke-width:3"/></g></g><path class="as" d="M46 34v8M42 38h8" style="stroke-width:2;animation:qa-tw 3s ease-in-out 0s infinite"/><path class="as" d="M196 46v8M192 50h8" style="stroke-width:2;animation:qa-tw 3s ease-in-out -1s infinite"/><path class="as" d="M58 114v8M54 118h8" style="stroke-width:2;animation:qa-tw 3s ease-in-out -2s infinite"/></svg>
