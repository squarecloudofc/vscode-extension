<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 20 300 232" fill="none"><style>
.gw{fill:var(--vscode-textLink-foreground,#3794ff);opacity:.16;filter:blur(18px)}
.sh{fill:#000;opacity:.28;filter:blur(5px)}
.ks,.as{--hd:1.2s}
.kb,.ab{--hd:3.4s}
.kd,.ad{--hd:5.6s}
.ki,.ai{--hd:7.8s}
.ao{fill:#000;opacity:.35;filter:blur(3px);animation:hm-ao 8.8s ease-in-out var(--hd) infinite}
.pt,.pl,.pr,.kt,.kl,.kr{stroke:var(--hm-edge,var(--vscode-contrastBorder,var(--vscode-widget-border,#454545)));stroke-width:.8;stroke-linejoin:round}
.pt{fill:var(--hm-pt,var(--vscode-editor-background,#1e1e1e))}
.pl{fill:var(--hm-pl,var(--vscode-editor-background,#1e1e1e))}
.pr{fill:var(--hm-pr,var(--vscode-editor-background,#1e1e1e))}
.kt,.dcf{fill:var(--hm-kt,var(--vscode-editor-background,#1e1e1e))}
.kl{fill:var(--hm-kl,var(--vscode-editor-background,#1e1e1e))}
.kr{fill:var(--hm-kr,var(--vscode-editor-background,#1e1e1e))}
.gd{stroke:var(--hm-grid,var(--vscode-widget-border,#454545));stroke-width:.8;stroke-dasharray:2 3}
.rm{stroke:var(--vscode-textLink-foreground,#3794ff);stroke-width:1.2;stroke-linejoin:round;opacity:.55}
.en{font-size:6px;font-weight:700;letter-spacing:.24em;fill:var(--vscode-descriptionForeground,#9d9d9d)}
.vt{stroke:var(--hm-edge,var(--vscode-widget-border,#454545));stroke-width:1.1;stroke-linecap:round}
.cb{color:var(--vscode-textLink-foreground,#3794ff)}
.cv{color:var(--hm-violet,var(--vscode-charts-purple,#b180d7))}
.ca{color:var(--vscode-editorWarning-foreground,#cca700)}
.cg{color:var(--vscode-testing-iconPassed,#3fb950)}
.dc{stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.fc{fill:currentColor;stroke:none}
.lid{fill:currentColor;fill-opacity:.22;animation:hm-lid 8.8s ease-in-out var(--hd) infinite}
.lf{animation:hm-lift 8.8s cubic-bezier(.34,1.56,.64,1) var(--hd) infinite}
.pk{fill:currentColor;opacity:0;animation:hm-up 8.8s ease-out var(--hd) infinite}
.hub{fill:var(--vscode-textLink-foreground,#3794ff);fill-opacity:.16;stroke:var(--vscode-textLink-foreground,#3794ff);stroke-width:1.2;stroke-linejoin:round}
.sp{stroke:var(--vscode-textLink-foreground,#3794ff);stroke-width:1.6;stroke-linecap:round;stroke-dasharray:2 4;opacity:.8;animation:hm-flow .9s linear infinite}
.pu{stroke:var(--vscode-textLink-foreground,#3794ff);stroke-width:1.2;animation:hm-pulse 2.4s ease-out infinite}
.led{fill:var(--vscode-testing-iconPassed,#3fb950);animation:hm-led 1.8s ease-in-out infinite}
.tw{fill:var(--vscode-textLink-foreground,#3794ff);animation:hm-tw 3s ease-in-out infinite}
.o{transform-box:fill-box;transform-origin:center}
.pf{animation:hm-rise .6s cubic-bezier(.16,1,.3,1) both}
.dr{animation:hm-drop .8s cubic-bezier(.34,1.56,.64,1) both}
@keyframes hm-flow{to{stroke-dashoffset:-12}}
@keyframes hm-pulse{0%{transform:scale(.7);opacity:.9}100%{transform:scale(1.7);opacity:0}}
@keyframes hm-led{50%{opacity:.25}}
@keyframes hm-tw{0%,100%{transform:scale(.3);opacity:0}50%{transform:scale(1);opacity:1}}
@keyframes hm-lid{0%,25%,100%{fill-opacity:.22}5%,20%{fill-opacity:.9}}
@keyframes hm-lift{0%,25%,100%{transform:none}5%,20%{transform:translateY(-4px)}}
@keyframes hm-ao{0%,25%,100%{opacity:.35}5%,20%{opacity:.18}}
@keyframes hm-up{0%{opacity:0;transform:none}3%{opacity:1}17%,100%{opacity:0;transform:translateY(-26px)}}
@keyframes hm-rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes hm-drop{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
