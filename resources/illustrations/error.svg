<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" fill="none"><style>.sd{fill:var(--vscode-editor-background,#1e1e1e);stroke:var(--vscode-foreground,#cccccc);stroke-opacity:.7;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.sl{fill:var(--vscode-editor-background,#1e1e1e);stroke:var(--vscode-foreground,#cccccc);stroke-opacity:.45;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.ln{fill:var(--vscode-foreground,#cccccc);opacity:.3}.tn{fill:var(--vscode-foreground,#cccccc);opacity:.1}.er{fill:var(--vscode-errorForeground,#f14c4c)}.es{fill:none;stroke:var(--vscode-errorForeground,#f14c4c);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.o{transform-box:fill-box;transform-origin:center}@keyframes q9-gl{0%,58%,66%,100%{transform:none}60%{transform:translateX(-3px)}62%{transform:translateX(2px)}64%{transform:translateX(-1px)}}@keyframes q9-sp{50%{transform:scale(.6) rotate(45deg);opacity:.5}}@keyframes q9-p1{50%{transform:translate(1px,-3px);opacity:.5}}@keyframes q9-p2{50%{transform:translate(-3px,-1px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect class="sl" x="104" y="26" width="64" height="64" rx="12"/><g style="animation:q9-gl 3s linear infinite"><path class="sd" d="M88 52H94L98 57L102 52H128A12 12 0 0 1 140 64V104A12 12 0 0 1 128 116H88A12 12 0 0 1 76 104V64A12 12 0 0 1 88 52Z"/><path class="tn" d="M88 52H94L98 57L102 52H128A12 12 0 0 1 140 64V104A12 12 0 0 1 128 116H88A12 12 0 0 1 76 104V64A12 12 0 0 1 88 52Z"/><path class="es" d="M98 57L93 67L101 74L94 86L99 93M101 74L109 77" style="stroke-width:2"/></g><g class="o" style="animation:q9-sp 3s ease-in-out infinite"><path class="er" d="M80 26Q81.6 32.4 88 34Q81.6 35.6 80 42Q78.4 35.6 72 34Q78.4 32.4 80 26Z"/></g><rect class="ln" x="93" y="38" width="5" height="5" rx="1.2" style="animation:q9-p1 3s ease-in-out infinite"/><rect class="ln" x="62" y="48" width="6" height="6" rx="1.5" style="animation:q9-p2 3s ease-in-out infinite"/></svg>
