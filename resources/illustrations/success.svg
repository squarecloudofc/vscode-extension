<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none"><style>.ac{fill:var(--vscode-textLink-foreground,#3794ff)}.ok{fill:var(--vscode-testing-iconPassed,#3fb950)}.os{fill:none;stroke:var(--vscode-testing-iconPassed,#3fb950);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.wa{fill:var(--vscode-editorWarning-foreground,#cca700)}.er{fill:var(--vscode-errorForeground,#f14c4c)}.o{transform-box:fill-box;transform-origin:center}.d{stroke-dasharray:100 110}@keyframes sd-gd{from{transform:scale(0)}}@keyframes sd-dr{from{stroke-dashoffset:104}}@keyframes sd-cf{from{transform:translateY(34px) scale(0);opacity:0}50%{opacity:1}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><circle class="ok o" cx="80" cy="80" r="44" opacity=".14" style="animation:sd-gd 0.5s ease-out .1s 1 both"/><circle class="os d" cx="80" cy="80" r="44" pathLength="100" transform="rotate(-90 80 80)" style="animation:sd-dr 0.6s cubic-bezier(.65,0,.35,1) 1 both"/><path class="os d" pathLength="100" d="M62 81l12 12 25-26" style="stroke-width:3.5;animation:sd-dr 0.35s cubic-bezier(.65,0,.35,1) .45s 1 both"/><g transform="rotate(15 80 80)"><circle class="ac o" cx="80" cy="14" r="3" style="animation:sd-cf 0.8s cubic-bezier(.2,.7,.3,1) 0.55s 1 both"/></g><g transform="rotate(45 80 80)"><circle class="ok o" cx="80" cy="22" r="2.5" style="animation:sd-cf 0.8s cubic-bezier(.2,.7,.3,1) 0.62s 1 both"/></g><g transform="rotate(75 80 80)"><circle class="wa o" cx="80" cy="14" r="3" style="animation:sd-cf 0.8s cubic-bezier(.2,.7,.3,1) 0.55s 1 both"/></g><g transform="rotate(105 80 80)"><circle class="er o" cx="80" cy="22" r="2.5" style="animation:sd-cf 0.8s cubic-bezier(.2,.7,.3,1) 0.62s 1 both"/></g><g transform="rotate(135 80 80)"><circle class="ac o" cx="80" cy="14" r="3" style="animation:sd-cf 0.8s cubic-bezier(.2,.7,.3,1) 0.55s 1 both"/></g><g transform="rotate(165 80 80)"><circle class="ok o" cx="80" cy="22" r="2.5" style="animation:sd-cf 0.8s cubic-bezier(.2,