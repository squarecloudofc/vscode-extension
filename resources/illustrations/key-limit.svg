<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" fill="none"><style>.sd{fill:var(--vscode-editor-background,#1e1e1e);stroke:var(--vscode-foreground,#cccccc);stroke-opacity:.7;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.ms{fill:none;stroke:var(--vscode-foreground,#cccccc);stroke-opacity:.7;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.ln{fill:var(--vscode-foreground,#cccccc);opacity:.3}.tn{fill:var(--vscode-foreground,#cccccc);opacity:.1}.wa{fill:var(--vscode-editorWarning-foreground,#cca700)}.kf{fill:var(--vscode-editor-background,#1e1e1e)}.kb{fill:none;stroke:var(--vscode-editor-background,#1e1e1e);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.o{transform-box:fill-box;transform-origin:center}.ot{transform-box:fill-box;transform-origin:50% 0}@keyframes q4-sw{25%{transform:rotate(3deg)}75%{transform:rotate(-3deg)}}@keyframes q4-hv{50%{transform:translateY(-5px)}}@keyframes q4-sd{50%{transform:scaleX(.75)}}@keyframes q4-nb{50%{transform:scale(1.12)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect class="sd" x="18" y="36" width="150" height="10" rx="5"/><path class="ms" d="M36 46v7"/><g class="ot" style="animation:q4-sw 4s ease-in-out 0.0s infinite"><circle class="sd" cx="36" cy="62" r="9"/><circle class="tn" cx="36" cy="62" r="9"/><path class="ms" d="M36 71V108M36 98h6M36 105h5"/></g><path class="ms" d="M64 46v7"/><g class="ot" style="animation:q4-sw 4s ease-in-out -0.7s infinite"><circle class="sd" cx="64" cy="62" r="9"/><circle class="tn" cx="64" cy="62" r="9"/><path class="ms" d="M64 71V108M64 96h6M64 104h5"/></g><path class="ms" d="M92 46v7"/><g class="ot" style="animation:q4-sw 4s ease-in-out -1.4s infinite"><circle class="sd" cx="92" cy="62" r="9"/><circle class="tn" cx="92" cy="62" r="9"/><path class="ms" d="M92 71V108M92 99h6M92 106h5"/></g><path class="ms" d="M120 46v7"/><g class="ot" style="animation:q4-sw 4s ease-in-out -2.1s infinite"><circle class="sd" cx="120" cy