<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" fill="none"><style>.sd{fill:var(--vscode-editor-background,#1e1e1e);stroke:var(--vscode-foreground,#cccccc);stroke-opacity:.7;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.ms{fill:none;stroke:var(--vscode-foreground,#cccccc);stroke-opacity:.7;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.ls{fill:none;stroke:var(--vscode-foreground,#cccccc);stroke-opacity:.45;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.fg{fill:var(--vscode-foreground,#cccccc)}.er{fill:var(--vscode-errorForeground,#f14c4c)}.o{transform-box:fill-box;transform-origin:center}@keyframes q1-fd{50%{opacity:.4}}@keyframes q1-fo{50%{opacity:.75}}@keyframes q1-fw{to{stroke-dashoffset:-20}}@keyframes q1-sp{0%,100%{transform:none}12%{transform:scale(.72) rotate(14deg);opacity:.6}24%{transform:scale(1.08)}40%{transform:scale(.88) rotate(-8deg);opacity:.85}55%{transform:none}}@keyframes q1-cl{50%{transform:translateY(-3px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect class="sd" x="21" y="50" width="62" height="46" rx="5"/><circle class="fg" cx="52" cy="85" r="3" opacity=".7"/><path class="ms" d="M44.9 77.9A10 10 0 0 1 59.1 77.9" style="animation:q1-fd 3s ease-in-out infinite"/><path class="ms" d="M38.6 71.6A19 19 0 0 1 65.4 71.6" style="opacity:.3;animation:q1-fo 3s ease-in-out infinite"/><rect class="sd" x="13" y="96" width="78" height="8" rx="4"/><path class="ls" d="M95 80H107" style="stroke-width:2.5;stroke-dasharray:5 5;animation:q1-fw 2.5s linear infinite"/><path class="ls" d="M133 80H150" style="stroke-width:2.5;stroke-dasharray:5 5"/><g class="o" style="animation:q1-sp 2.6s linear infinite"><path class="er" d="M120 69Q122.2 77.8 131 80Q122.2 82.2 120 91Q117.8 82.2 109 80Q117.8 77.8 120 69Z"/><circle class="er" cx="132" cy="68" r="2"/><circle class="er" cx="108" cy="93" r="1.6"/></g><g style="animation:q1-cl 4s ease-in-out infinite"><path class="sd" d="M168.7 100A10.