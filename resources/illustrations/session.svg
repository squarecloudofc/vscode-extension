<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" fill="none"><style>.sd{fill:var(--vscode-editor-background,#1e1e1e);stroke:var(--vscode-foreground,#cccccc);stroke-opacity:.7;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.ms{fill:none;stroke:var(--vscode-foreground,#cccccc);stroke-opacity:.7;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.ln{fill:var(--vscode-foreground,#cccccc);opacity:.3}.tn{fill:var(--vscode-foreground,#cccccc);opacity:.1}.wa{fill:var(--vscode-editorWarning-foreground,#cca700)}.ws{fill:none;stroke:var(--vscode-editorWarning-foreground,#cca700);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.kf{fill:var(--vscode-editor-background,#1e1e1e)}.o{transform-box:fill-box;transform-origin:center}@keyframes q2-sd{50%{transform:scaleX(.85)}}@keyframes q2-bb{50%{transform:translateY(-4px)}}@keyframes q2-fd{50%{opacity:.5}}@keyframes q2-mn{to{transform:rotate(360deg)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><ellipse class="ln o" cx="112" cy="140" rx="42" ry="4" style="animation:q2-sd 4s ease-in-out infinite"/><g style="animation:q2-bb 4s ease-in-out infinite"><g style="animation:q2-fd 4s ease-in-out infinite"><g transform="rotate(28 104 84)"><path class="sd" d="M90 78H166a6 6 0 0 1 0 12h-2v8h-9v-8h-4v10h-9v-10H90z"/><circle class="sd" cx="72" cy="84" r="21"/><circle class="tn" cx="72" cy="84" r="21"/><circle class="ms" cx="72" cy="84" r="6.5"/></g></g></g><circle class="kf" cx="164" cy="50" r="21"/><circle class="wa" cx="164" cy="50" r="21" opacity=".14"/><circle class="ws" cx="164" cy="50" r="21"/><path class="ws" d="M164 50h8"/><path class="ws" d="M164 50v-12" style="transform-origin:164px 50px;animation:q2-mn 4s linear infinite"/><circle class="wa" cx="164" cy="50" r="2.8"/></svg>
