<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" fill="none"><style>.sd{fill:var(--vscode-editor-background,#1e1e1e);stroke:var(--vscode-foreground,#cccccc);stroke-opacity:.7;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.ln{fill:var(--vscode-foreground,#cccccc);opacity:.3}.wa{fill:var(--vscode-editorWarning-foreground,#cca700)}.ws{fill:none;stroke:var(--vscode-editorWarning-foreground,#cca700);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}.kf{fill:var(--vscode-editor-background,#1e1e1e)}@keyframes q7-bl{35%,65%{opacity:1}50%{opacity:.2}}@keyframes q7-wr{0%,50%,100%{transform:none}25%{transform:rotate(-18deg)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect class="sd" x="62" y="30" width="100" height="26" rx="6"/><circle class="wa" cx="77" cy="43" r="3.5" style="animation:q7-bl 2.7s ease-in-out 0.0s infinite"/><circle class="ln" cx="88" cy="43" r="3.5"/><rect class="ln" x="102" y="40" width="44" height="6" rx="3"/><rect class="sd" x="62" y="62" width="100" height="26" rx="6"/><circle class="wa" cx="77" cy="75" r="3.5" style="animation:q7-bl 2.7s ease-in-out -0.9s infinite"/><circle class="ln" cx="88" cy="75" r="3.5"/><rect class="ln" x="102" y="72" width="44" height="6" rx="3"/><rect class="sd" x="62" y="94" width="100" height="26" rx="6"/><circle class="wa" cx="77" cy="107" r="3.5" style="animation:q7-bl 2.7s ease-in-out -1.8s infinite"/><circle class="ln" cx="88" cy="107" r="3.5"/><rect class="ln" x="102" y="104" width="44" height="6" rx="3"/><circle class="kf" cx="160" cy="116" r="19"/><circle class="wa" cx="160" cy="116" r="19" opacity=".14"/><circle class="ws" cx="160" cy="116" r="19"/><g style="transform-origin:160px 116px;animation:q7-wr 3s ease-in-out infinite"><g transform="translate(160 116) rotate(45)"><path class="wa" d="M3 -13.3A7 7 0 1 1 -3 -13.3L-1.8 -8.6H1.8Z"/><rect class="wa" x="-2.7" y="-3" width="5.4" height="16" rx="2.7"/></g></g></svg>
