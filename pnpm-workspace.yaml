settings:
  enablePrePostScripts: true

minimumReleaseAgeExclude:
  - '@squarecloud/api'

# Security floors for vulnerable transitive dev deps (Dependabot alerts).
overrides:
  'undici@7': '^7.28.0'
  'form-data@4': '^4.0.6'
  'js-yaml@4': '^4.2.0'

onlyBuiltDependencies:
  - '@biomejs/biome'
  - '@vscode/vsce-sign'
  - esbuild
  - keytar

allowBuilds:
  '@biomejs/biome': true
  '@vscode/vsce-sign': true
  esbuild: true
  keytar: true
